<div *ngIf="mobileOpen" class="sidebar-backdrop" (click)="onCloseMobile()"></div>

<aside class="sidebar-wrapper" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">
  <div class="sidebar-brand">
    <div class="brand-logo" [title]="collapsed ? 'UTY UserBot' : ''">
      <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <div *ngIf="!collapsed" class="brand-text">
      <span class="brand-name">UTY UserBot</span>
      <span class="brand-badge">Monitoring</span>
    </div>
    <button
      class="collapse-btn desktop-only"
      (click)="onToggle()"
      [title]="collapsed ? 'Kengaytirish' : 'Yigʻish'"
    >
      <svg *ngIf="!collapsed" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
      </svg>
      <svg *ngIf="collapsed" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
      </svg>
    </button>
    <button class="mobile-close-btn mobile-only" (click)="onCloseMobile()" title="Yopish">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="sidebar-status" [title]="connected ? 'Userbot Online' : 'Userbot Offline'">
    <div class="status-indicator" [class.online]="connected" [class.offline]="!connected">
      <span class="dot"></span>
      <span *ngIf="!collapsed" class="text">{{ connected ? 'Userbot Online' : 'Userbot Offline' }}</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <button
      class="nav-item"
      [class.active]="activeSection === 'channels'"
      (click)="selectSection('channels')"
      [title]="collapsed ? 'Kanallar (' + (counts?.channels ?? 0) + ')' : ''"
    >
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
      </svg>
      <span *ngIf="!collapsed" class="nav-label">Kanallar</span>
      <span *ngIf="!collapsed" class="nav-badge">{{ counts?.channels ?? 0 }}</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeSection === 'keywords'"
      (click)="selectSection('keywords')"
      [title]="collapsed ? 'Kalit Soʻzlar (' + (counts?.keywords ?? 0) + ')' : ''"
    >
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
      </svg>
      <span *ngIf="!collapsed" class="nav-label">Kalit So'zlar</span>
      <span *ngIf="!collapsed" class="nav-badge">{{ counts?.keywords ?? 0 }}</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeSection === 'groups'"
      (click)="selectSection('groups')"
      [title]="collapsed ? 'Guruhlar (' + (counts?.groups ?? 0) + ')' : ''"
    >
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      <span *ngIf="!collapsed" class="nav-label">Guruhlar</span>
      <span *ngIf="!collapsed" class="nav-badge">{{ counts?.groups ?? 0 }}</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeSection === 'history'"
      (click)="selectSection('history')"
      [title]="collapsed ? 'Tahlil Tarixi (' + (counts?.history ?? 0) + ')' : ''"
    >
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <span *ngIf="!collapsed" class="nav-label">Tahlil Tarixi</span>
      <span *ngIf="!collapsed" class="nav-badge">{{ counts?.history ?? 0 }}</span>
    </button>

    <button
      class="nav-item"
      [class.active]="activeSection === 'system'"
      (click)="selectSection('system')"
      [title]="collapsed ? 'Tizim Holati' : ''"
    >
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span *ngIf="!collapsed" class="nav-label">Tizim Holati</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="user-box" [title]="botUser?.firstName || 'Admin'">
      <div class="user-avatar">
        {{ (botUser?.firstName ? botUser.firstName[0] : 'A') | uppercase }}
      </div>
      <div *ngIf="!collapsed" class="user-details">
        <span class="user-name">{{ botUser?.firstName || 'Admin' }}</span>
        <span class="user-role">{{ botUser?.username ? '@' + botUser.username : 'Boshqaruvchi' }}</span>
      </div>
    </div>

    <button class="logout-button" (click)="onLogout()" title="Chiqish">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
    </button>
  </div>
</aside>
