<div class="dash-layout">
  <div *ngIf="toast()" class="dash-toast" [ngClass]="toast().type">
    <svg *ngIf="toast().type === 'success'" class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <svg *ngIf="toast().type === 'error'" class="w-5 h-5 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
    <span>{{ toast().message }}</span>
  </div>

  <app-sidebar
    [activeSection]="activeSection()"
    [counts]="status()?.stats"
    [connected]="status()?.connected"
    [botUser]="status()?.botUser"
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileSidebarOpen()"
    (sectionChange)="onSectionChange($event)"
    (toggleCollapse)="toggleSidebar()"
    (closeMobile)="closeMobileSidebar()"
    (logoutClick)="logout()"
  ></app-sidebar>

  <div class="dash-main" [class.expanded]="sidebarCollapsed()">
    <header class="dash-topbar">
      <div class="topbar-left">
        <button
          class="topbar-collapse-btn"
          (click)="toggleSidebar()"
          [title]="sidebarCollapsed() ? 'Yon panelni kengaytirish' : 'Yon panelni yigʻish'"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div class="topbar-title-block">
          <h1 class="topbar-title">
            {{ i18n.t('title.' + activeSection()) }}
          </h1>
          <p class="topbar-subtitle">
            {{ i18n.t('sub.' + activeSection()) }}
          </p>
        </div>
      </div>

      <div class="topbar-actions">
        <!-- Pause / Resume Pill -->
        <button
          *ngIf="systemMode().isPaused"
          (click)="togglePause()"
          class="flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30 transition-all cursor-pointer"
          title="Tizim to'xtatilgan. Davom ettirish uchun bosing"
        >
          <span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span>
          <span>{{ i18n.t('topbar.paused') }}</span>
        </button>

        <!-- Simulation Pill -->
        <button
          *ngIf="systemMode().isSimulationMode"
          (click)="toggleSimulation()"
          class="flex items-center gap-1.5 px-3 py-1 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/30 transition-all cursor-pointer"
          title="Simulyatsiya rejimi: guruhlarga yuborilmaydi"
        >
          <span>{{ i18n.t('topbar.simulation') }}</span>
        </button>

        <span hlmBadge [variant]="status()?.connected ? 'success' : 'warning'" class="gap-1.5 py-1 px-3">
          <span class="status-dot"></span>
          <span>{{ status()?.connected ? i18n.t('topbar.tg_active') : i18n.t('topbar.tg_idle') }}</span>
        </span>

        <span hlmBadge variant="outline" class="gap-1.5 py-1 px-3 text-purple-400 border-purple-500/30 bg-purple-500/10">
          <svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
          <span>{{ status()?.groqModel || 'Groq Llama-3' }}</span>
        </span>

        <!-- Language Switcher UZ / RU -->
        <div class="flex items-center bg-slate-800/80 border border-slate-700/60 rounded-lg p-0.5 text-xs mr-1">
          <button
            type="button"
            class="px-2 py-1 rounded transition-all font-semibold cursor-pointer"
            [class.bg-blue-600]="i18n.currentLang() === 'uz'"
            [class.text-white]="i18n.currentLang() === 'uz'"
            [class.text-slate-400]="i18n.currentLang() !== 'uz'"
            (click)="switchLang('uz')"
          >
            🇺🇿 UZ
          </button>
          <button
            type="button"
            class="px-2 py-1 rounded transition-all font-semibold cursor-pointer"
            [class.bg-blue-600]="i18n.currentLang() === 'ru'"
            [class.text-white]="i18n.currentLang() === 'ru'"
            [class.text-slate-400]="i18n.currentLang() !== 'ru'"
            (click)="switchLang('ru')"
          >
            🇷🇺 RU
          </button>
        </div>

        <button hlmBtn variant="outline" size="sm" (click)="refreshAll()" [disabled]="loading()" class="gap-1.5">
          <svg class="w-4 h-4 text-slate-400" [class.animate-spin]="loading()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>{{ i18n.t('topbar.refresh') }}</span>
        </button>
      </div>
    </header>

    <main class="dash-content-body">
      <app-channels
        *ngIf="activeSection() === 'channels'"
        [channels]="channels()"
        (addChannel)="handleAddChannel($event)"
        (addBatchChannels)="handleAddBatchChannels($event)"
        (updateChannel)="handleUpdateChannel($event)"
        (deleteChannel)="handleDeleteChannel($event)"
      ></app-channels>

      <app-keywords
        *ngIf="activeSection() === 'keywords'"
        [keywords]="keywords()"
        (addKeyword)="handleAddKeyword($event)"
        (addBatchKeywords)="handleAddBatchKeywords($event)"
        (updateKeyword)="handleUpdateKeyword($event)"
        (deleteKeyword)="handleDeleteKeyword($event)"
      ></app-keywords>

      <app-groups
        *ngIf="activeSection() === 'groups'"
        [groups]="groups()"
        (addGroup)="handleAddGroup($event)"
        (updateGroup)="handleUpdateGroup($event)"
        (deleteGroup)="handleDeleteGroup($event)"
      ></app-groups>

      <app-history
        *ngIf="activeSection() === 'history'"
        [history]="history()"
        (refresh)="loadHistory()"
        (resendItem)="handleResendHistory($event)"
        (deleteItem)="handleDeleteHistoryItem($event)"
        (clearAll)="handleClearHistory()"
      ></app-history>

      <app-tester
        *ngIf="activeSection() === 'tester'"
      ></app-tester>

      <app-inspector
        *ngIf="activeSection() === 'inspector'"
        [channels]="channels()"
        [keywords]="keywords()"
      ></app-inspector>

      <app-system-status
        *ngIf="activeSection() === 'system'"
        [status]="status()"
        (statusChanged)="refreshAll()"
      ></app-system-status>

      <app-logs
        *ngIf="activeSection() === 'logs'"
      ></app-logs>
    </main>
  </div>
</div>
